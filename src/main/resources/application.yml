spring:
  application:
    name: smart-basket-mcp
  datasource:
    url: jdbc:postgresql://localhost:5432/smart_basket
    username: postgres
    # ponytail: dev-only plaintext; override via SPRING_DATASOURCE_PASSWORD env before exposing the server
    password: ${SPRING_DATASOURCE_PASSWORD:password}
  jpa:
    hibernate:
      ddl-auto: validate   # Flyway owns the schema
    open-in-view: false
  flyway:
    enabled: true
  ai:
    mcp:
      server:
        name: smart-basket-mcp
        version: 0.1.0
        type: SYNC
        instructions: "Grocery memory layer: reusable baskets, substitutions, AI baskets, refill prediction on top of Swiggy Instamart."
        capabilities:
          tool: true
        sse-message-endpoint: /mcp/messages

server:
  port: 8080
